name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: pinned
            pre: false
          - ha-version: dev
            pre: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: pip install -r requirements_dev.txt

      # `pytest-homeassistant-custom-component` is generated per Home
      # Assistant release, so upgrading `homeassistant` alone leaves the
      # test harness pinned to the previous version and the leg fails on
      # unrelated fixture drift. Upgrade both, pre-releases included.
      - name: Install latest Home Assistant (dev matrix leg)
        if: matrix.pre
        run: |
          pip install --pre --upgrade \
            homeassistant \
            pytest-homeassistant-custom-component

      - name: Run tests with coverage
        run: pytest --cov=custom_components.cast_notifier --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.ha-version }}
          path: coverage.xml

# Re-saved on 2026-09-07 to re-register push/tag triggers (push events were not scheduling runs on this repository).
